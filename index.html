<!DOCTYPE html>
<html>
<head>
  <<!DOCTYPE html>
<html>
<head>
  <title>Calculator</title>
  <style>
    body {
      background: linear-gradient(to bottom, #001f3f, #000a14);
      color: white;
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      overflow-x: hidden;
    }

    .calculator-section {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .calculator {
      background-color: #1c1c1c;
      padding: 20px;
      border-radius: 15px;
      width: 260px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      position: relative;
      z-index: 2;
    }

    #display {
      width: 100%;
      height: 50px;
      font-size: 24px;
      text-align: right;
      margin-bottom: 15px;
      padding: 10px;
      box-sizing: border-box;
      border: none;
      border-radius: 8px;
      background: #2b2b2b;
      color: white;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      padding: 15px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background-color: #333;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #444;
    }

    .operator {
      background-color: #ff9500;
    }

    .operator:hover {
      background-color: #e08600;
    }

    .hidden-section {
      margin-top: 200px;
      padding-bottom: 50px;
      position: relative;
      z-index: 2;
    }

    a {
      color: #4dd0e1;
      font-size: 18px;
      font-weight: bold;
    }

    iframe {
      background-color: white;
      margin-top: 15px;
      border-radius: 8px;
    }

    .fish {
      position: fixed;
      font-size: 30px;
      z-index: 1;
      pointer-events: none;
      animation: swim linear infinite;
    }

    .fish1 { top: 15%; animation-duration: 14s; }
    .fish2 { top: 45%; animation-duration: 18s; animation-delay: 2s; font-size: 40px; }
    .fish3 { top: 75%; animation-duration: 12s; animation-delay: 5s; }
    .fish4 { top: 88%; animation-duration: 20s; animation-delay: 1s; font-size: 25px; }

    @keyframes swim {
      0% { left: 105%; }
      100% { left: -10%; }
    }
  </style>
</head>
<body>
  <div class="fish fish1">🐟</div>
  <div class="fish fish2">🐠</div>
  <div class="fish fish3">🐡</div>
  <div class="fish fish4">🐟</div>

  <div class="calculator-section">
    <div class="calculator">
      <input type="text" id="display" disabled>
      <div class="buttons">
        <button onclick="clearDisplay()">C</button>
        <button onclick="append('/')" class="operator">/</button>
        <button onclick="append('*')" class="operator">*</button>
        <button onclick="append('-')" class="operator">-</button>
        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button onclick="append('+')" class="operator">+</button>
        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button onclick="calculate()" class="operator">=</button>
        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>
        <button onclick="append('0')">0</button>
      </div>
    </div>
  </div>

  <div class="hidden-section">
    <p>
      <a href="https://example.com" target="embedFrame">Open Website</a>
    </p>
    <iframe name="embedFrame" width="100%" height="600px" style="border: none;"></iframe>
  </div>

  <script>
    const display = document.getElementById('display');
    function append(val) {
      display.value += val;
    }
    function clearDisplay() {
      display.value = '';
    }
    function calculate() {
      try {
        display.value = eval(display.value);
      } catch {
        display.value = 'Error';
      }
    }
  </script>
</body>
</html>
