<!DOCTYPE html>
<html>
<head>
  <title>Calculator</title>
  <style>
    body {
      background: linear-gradient(to bottom, #001f3f, #000a14);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      overflow-x: hidden;
    }

    .calculator-section {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .calculator {
      background-color: #141414;
      padding: 24px;
      border-radius: 28px;
      width: 300px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      z-index: 2;
    }

    .display-container {
      background: #000;
      border-radius: 16px;
      padding: 15px 20px;
      margin-bottom: 20px;
      text-align: right;
    }

    #history {
      font-size: 14px;
      color: #888;
      min-height: 20px;
      overflow: hidden;
    }

    #display {
      width: 100%;
      font-size: 42px;
      font-weight: 300;
      text-align: right;
      border: none;
      background: transparent;
      color: white;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 62px;
      font-size: 22px;
      border: none;
      border-radius: 50%;
      background-color: #2c2c2e;
      color: white;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
    }

    button:active {
      transform: scale(0.92);
    }

    button:hover {
      background-color: #3a3a3c;
    }

    .top-btn {
      background-color: #a5a5a5;
      color: black;
      font-weight: 500;
    }

    .top-btn:hover {
      background-color: #bdbdbd;
    }

    .operator {
      background-color: #ff9f0a;
      font-size: 26px;
    }

    .operator:hover {
      background-color: #ffb340;
    }

    .zero {
      grid-column: span 2;
      border-radius: 35px;
      text-align: left;
      padding-left: 26px;
    }

    .hidden-section {
      margin-top: 250px;
      padding-bottom: 50px;
      position: relative;
      z-index: 2;
    }

    iframe {
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .fish {
      position: fixed;
      font-size: 30px;
      z-index: 1;
      pointer-events: none;
      animation: swim linear infinite;
    }

    .fish1 { top: 15%; animation-duration: 14s; }
    .fish2 { top: 45%; animation-duration: 18s; animation-delay: 2s; font-size: 40px; }
    .fish3 { top: 75%; animation-duration: 12s; animation-delay: 5s; }
    .fish4 { top: 88%; animation-duration: 20s; animation-delay: 1s; font-size: 25px; }

    @keyframes swim {
      0% { left: 105%; }
      100% { left: -10%; }
    }
  </style>
</head>
<body>
  <div class="fish fish1">🐟</div>
  <div class="fish fish2">🐠</div>
  <div class="fish fish3">🐡</div>
  <div class="fish fish4">🐟</div>

  <div class="calculator-section">
    <div class="calculator">
      <div class="display-container">
        <div id="history"></div>
        <input type="text" id="display" value="0" readonly>
      </div>
      <div class="buttons">
        <button onclick="clearDisplay()" class="top-btn">AC</button>
        <button onclick="backspace()" class="top-btn">⌫</button>
        <button onclick="percent()" class="top-btn">%</button>
        <button onclick="append('/')" class="operator">÷</button>

        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button onclick="append('*')" class="operator">×</button>

        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button onclick="append('-')" class="operator">−</button>

        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>
        <button onclick="append('+')" class="operator">+</button>

        <button onclick="append('0')" class="zero">0</button>
        <button onclick="append('.')">.</button>
        <button onclick="calculate()" class="operator">=</button>
      </div>
    </div>
  </div>

  <div class="hidden-section">
    <iframe src="https://example.com" width="100%" height="600px" style="border: none;"></iframe>
  </div>

  <script>
    const display = document.getElementById('display');
    const history = document.getElementById('history');
    let resetNext = false;

    function append(val) {
      if (display.value === '0' || display.value === 'Error' || resetNext) {
        if (['+', '-', '*', '/'].includes(val)) {
          resetNext = false;
        } else {
          display.value = '';
          resetNext = false;
        }
      }
      display.value += val;
    }

    function clearDisplay() {
      display.value = '0';
      history.textContent = '';
    }

    function backspace() {
      if (display.value.length > 1 && display.value !== 'Error') {
        display.value = display.value.slice(0, -1);
      } else {
        display.value = '0';
      }
    }

    function percent() {
      try {
        display.value = parseFloat(display.value) / 100;
      } catch {
        display.value = 'Error';
      }
    }

    function calculate() {
      try {
        const expr = display.value;
        history.textContent = expr.replace(/\*/g, '×').replace(/\//g, '÷') + ' =';
        display.value = Number(eval(expr).toFixed(8));
        resetNext = true;
      } catch {
        display.value = 'Error';
      }
    }
  </script>
</body>
</html>
